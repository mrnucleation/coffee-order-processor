[package]
name = "coffee-order-processor"
version = "0.1.1"
description = "Convert Shopify coffee orders into production-ready Excel workbooks"
authors = ["Coffee Order Processor"]
edition = "2021"

[lib]
name = "coffee_order_processor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
csv = "1"
rust_xlsxwriter = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
